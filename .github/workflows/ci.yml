name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Version consistency
        # Версия SDK (avito.Version) == info.version из openapi.json == avito.APIVersion.
        run: |
          spec=$(jq -r '.info.version' openapi.json)
          api=$(sed -n 's/^[[:space:]]*APIVersion[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' avito/version.go)
          sdk=$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' avito/version.go)
          echo "openapi.json=$spec APIVersion=$api Version=$sdk"
          if [ -z "$spec" ] || [ "$spec" != "$api" ] || [ "$spec" != "$sdk" ]; then
            echo "Версии расходятся"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test ./... -race
